name: Web CI

on:
  push:
    branches: ['**']
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'

defaults:
  run:
    working-directory: apps/web

env:
  # Public client values (publishable key — safe to expose). Needed at build
  # time because Vite inlines import.meta.env.VITE_* into the bundle.
  VITE_SUPABASE_URL: https://dqhhpoxqrtlmhosrsdxp.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qUEpzxNw_Sn8CGk3EiIaXw_lJiio6rt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          # 22+: supabase-js requiert le WebSocket natif (le VPS, lui, reste
          # en Node 20 avec le polyfill ws de server.mjs).
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Playwright E2E
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  # Auto-deploy on push to main. Requires these repo secrets:
  #   VPS_SSH_KEY  — private key whose public half is in cursor@VPS authorized_keys
  #   VPS_HOST     — 77.87.110.100
  #   VPS_USER     — cursor
  # Until those are set, this job is skipped (guarded by the secret check).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_SSH_KEY not set — skipping deploy."
          fi
      - name: Setup SSH
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync + rebuild + restart (with healthcheck + rollback)
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude .env --exclude e2e \
            --exclude test-results --exclude playwright-report \
            apps/web/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/script/bighead-web/"
          # Build into a fresh dist, keep the live one as dist.prev so a broken
          # build/restart can be rolled back without a window of downtime. The
          # /healthz probe (served by server.mjs even if SSR throws) is the gate.
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd /home/script/bighead-web
          pnpm install --frozen-lockfile
          rm -rf dist.prev
          [ -d dist ] && cp -a dist dist.prev || true
          pnpm build
          pm2 restart bighead-web --update-env
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS -m 3 http://127.0.0.1:3050/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::healthcheck failed — rolling back to previous dist"
            if [ -d dist.prev ]; then
              rm -rf dist && mv dist.prev dist
              pm2 restart bighead-web --update-env
            fi
            exit 1
          fi
          rm -rf dist.prev
          echo "deploy healthy"
          DEPLOY
      - name: Ping IndexNow
        if: steps.gate.outputs.ready == 'true'
        run: |
          # Notifie Bing/IndexNow que le site a changé (adoption immédiate côté
          # Bing → alimente aussi ChatGPT search). La clé est servie en statique.
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "play.bighead-quizz.com",
              "key": "d142c3a1269c444eb339ed150ad832c8",
              "keyLocation": "https://play.bighead-quizz.com/d142c3a1269c444eb339ed150ad832c8.txt",
              "urlList": [
                "https://play.bighead-quizz.com/",
                "https://play.bighead-quizz.com/play",
                "https://play.bighead-quizz.com/weekly",
                "https://play.bighead-quizz.com/quiz/general",
                "https://play.bighead-quizz.com/quiz/history",
                "https://play.bighead-quizz.com/quiz/geography",
                "https://play.bighead-quizz.com/quiz/music",
                "https://play.bighead-quizz.com/quiz/science",
                "https://play.bighead-quizz.com/quiz/literature",
                "https://play.bighead-quizz.com/quiz/technology",
                "https://play.bighead-quizz.com/quiz/animals",
                "https://play.bighead-quizz.com/quiz/sport",
                "https://play.bighead-quizz.com/quiz/cinema",
                "https://play.bighead-quizz.com/quiz/nature"
              ]
            }' || echo "::warning::IndexNow ping failed (non-blocking)"
